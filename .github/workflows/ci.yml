name: Verificar cambios

on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_call:
    inputs:
      pages_artifact:
        description: Nombre del artefacto para GitHub Pages
        type: string
        default: ''
    outputs:
      pages_artifact:
        description: Artefacto compilado y verificado
        value: ${{ jobs.verificar.outputs.pages_artifact }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact: ${{ inputs.pages_artifact }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:outbox
      - run: npm run test:offline
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - run: npm run test:lighthouse
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v5.0.0
        if: inputs.pages_artifact != ''
        with:
          name: ${{ inputs.pages_artifact }}
          path: dist
          include-hidden-files: true # Conserva dist/.nojekyll.
