name: Publicar Mis estudios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Liberar despliegue de Pages bloqueado
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED_DEPLOYMENT: 88a8fa521a4bff9ef73d425ac18a1cad93c9d1e5
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages/deployments/${process.env.BLOCKED_DEPLOYMENT}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const finished = new Set(['succeed', 'deployment_cancelled', 'deployment_failed', 'deployment_content_failed', 'deployment_lost', 'not_found']);
          async function request(method = 'GET') {
            const response = await fetch(endpoint + (method === 'POST' ? '/cancel' : ''), { method, headers });
            if (method === 'GET' && response.status === 404) return { status: 'not_found' };
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`GitHub respondió HTTP ${response.status}: ${data.message || 'no se pudo completar la operación'}`);
            return data;
          }
          let deployment = await request();
          console.log(`Estado del despliegue anterior: ${deployment.status}`);
          if (!['succeed', 'not_found'].includes(deployment.status)) {
            await request('POST');
            for (let attempt = 0; attempt < 24; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              deployment = await request();
              console.log(`Estado después de cancelar: ${deployment.status}`);
              if (finished.has(deployment.status)) break;
            }
            if (!finished.has(deployment.status)) throw new Error('Pages todavía no liberó el despliegue anterior.');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true # Conserva dist/.nojekyll.
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
